<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#181818">
  <meta name="description" content="Gesture Frame：将 10 秒以内的视频拆成静态帧，用于动态速写练习。">
  <title>Gesture Frame</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app">
    <section id="viewer" aria-label="速写参考画面">
      <canvas id="canvas" class="hidden"></canvas>
      <div id="watermark" aria-label="作者水印">@mxx0290</div>
      <div id="countdown" class="hidden paused" aria-live="polite">等待训练</div>

      <section id="empty" aria-labelledby="welcomeTitle">
        <h1 id="welcomeTitle">你好👋</h1>
        <p>
          这是一个可以拿来练习动态速写的工具。你可以上传一个
          <strong>10 秒以内</strong>的动态视频，并跟着它进行速写练习。
          推荐选择 <strong>8 FPS</strong>、<strong>60 秒更换一帧</strong>，
          当然你也可以自己选择各种帧数和时间限制。开练吧 bro👍
        </p>
        <button id="tutorialStartBtn" class="primary wide" type="button">选择视频，开始练习</button>
      </section>

      <div id="progressBox" role="status" aria-live="polite">
        <div id="progressText">分析中...</div>
        <progress id="progressBar" value="0" max="100"></progress>
      </div>
    </section>

    <section id="controls" aria-label="训练控制区">
      <div id="info">等待视频</div>

      <div id="timelineBox">
        <span id="frameLabel">Frame 0 / 0</span>
        <input id="timeline" type="range" min="0" max="0" value="0" aria-label="帧时间轴">
      </div>

      <nav id="toolbar" aria-label="工具栏">
        <button id="prevBtn" type="button" title="上一帧" aria-label="上一帧">◀</button>
        <button id="playBtn" type="button" title="播放或暂停" aria-label="播放或暂停">▶</button>
        <button id="nextBtn" type="button" title="下一帧" aria-label="下一帧">▶</button>
        <button id="onionBtn" type="button">洋葱皮</button>
        <button id="trainingBtn" type="button">训练</button>
        <button id="settingsBtn" type="button" title="设置" aria-label="设置">⚙</button>
        <button id="fullscreenBtn" type="button" title="全屏" aria-label="全屏">⛶</button>
      </nav>
    </section>
  </main>

  <div id="settingsBackdrop" class="hidden" aria-hidden="true">
    <section id="settings" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <header class="settingsHeader">
        <h2 id="settingsTitle">设置</h2>
        <button id="closeSettingsBtn" class="iconButton" type="button" aria-label="关闭设置">×</button>
      </header>

      <label>
        <span>上传视频（10 秒以内）</span>
        <input id="fileInput" type="file" accept="video/*">
      </label>

      <label>
        <span>抽帧 FPS</span>
        <select id="fpsSelect">
          <option value="24">24 FPS</option>
          <option value="12">12 FPS</option>
          <option value="8" selected>8 FPS（推荐）</option>
          <option value="6">6 FPS</option>
        </select>
      </label>

      <label>
        <span>每帧停留时间</span>
        <select id="timeSelect">
          <option value="1">1 秒</option>
          <option value="2">2 秒</option>
          <option value="5">5 秒</option>
          <option value="10">10 秒</option>
          <option value="15">15 秒</option>
          <option value="30">30 秒</option>
          <option value="60" selected>60 秒（推荐）</option>
        </select>
      </label>

      <label>
        <span>洋葱皮透明度</span>
        <input id="onionOpacity" type="range" min="0" max="100" value="25">
      </label>

      <button id="startBtn" class="primary wide" type="button">开始训练</button>
    </section>
  </div>

  <video id="video" playsinline muted></video>
  <script src="app.js"></script>
</body>
</html>
