<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gesture Frame v1.2</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

width:100vw;

height:100vh;

overflow:hidden;

background:#181818;

color:white;

font-family:
Arial,
"Microsoft YaHei",
sans-serif;

}



#app{

width:100%;

height:100%;

display:flex;

flex-direction:column;

}




#viewer{

flex:1;

position:relative;

display:flex;

justify-content:center;

align-items:center;

}




canvas{

max-width:90vw;

max-height:75vh;

}




#empty{

position:absolute;

text-align:center;

opacity:.8;

font-size:20px;

}



#info{

height:40px;

text-align:center;

font-size:18px;

}




#timelineBox{

width:90%;

margin:auto;

display:flex;

align-items:center;

gap:10px;

}



#timeline{

flex:1;

}




#toolbar{

position:fixed;

bottom:20px;

left:50%;

transform:translateX(-50%);


display:flex;

gap:8px;


background:#303030;


padding:10px;


border-radius:18px;


z-index:50;


}




button{

min-width:45px;

height:45px;


border:0;


border-radius:12px;


cursor:pointer;


font-size:14px;

}




button:active{

transform:scale(.95);

}




#settings{

position:fixed;

top:20px;

right:20px;


width:280px;


padding:20px;


background:#292929;


border-radius:15px;


z-index:100;


}




#settings label{

display:block;

margin-bottom:15px;

}




select,
input{

width:100%;

}




.hidden{

display:none!important;

}




#progressBox{

display:none;

position:absolute;


width:300px;


text-align:center;

}




#progressBar{

width:100%;

}



#video{

display:none;

}

#countdown{
font-size: 24px;
font-weight: bold;
color: #ff6b6b;
}


</style>


</head>



<body>


<div id="app">


<div id="viewer">


<canvas id="canvas"></canvas>




<div id="empty">

<div style="font-size:32px">

Gesture Frame

</div>


<br>


点击 ⚙ 上传动作视频


</div>




<div id="progressBox">


<div id="progressText">

分析中...

</div>


<progress
id="progressBar"
value="0"
max="100">
</progress>


</div>




</div>





<div id="info">

等待视频

</div>




<div id="timelineBox">


<span id="frameLabel">

Frame 0 / 0

</span>

<span id="countdown" class="hidden"></span>


<input
id="timeline"
type="range"
min="0"
max="0"
value="0"
>



</div>




<div id="toolbar">


<button onclick="prevFrame()">

◀

</button>


<button onclick="togglePlay()">

▶Ⅱ

</button>



<button onclick="nextFrame()">

▶

</button>




<button id="onionBtn"
onclick="toggleOnion()">

洋葱皮

</button>




<button onclick="toggleTraining()">

训练

</button>




<button onclick="toggleSettings()">

⚙

</button>




<button onclick="toggleFullscreen()">

⛶

</button>




</div>




<div id="settings"
class="hidden">


<h3>

设置

</h3>




<label>

上传视频

<input
id="fileInput"
type="file"
accept="video/*"
>

</label>




<label>

抽帧 FPS


<select id="fpsSelect">


<option value="24">

24 FPS

</option>


<option value="12">

12 FPS

</option>


<option value="8"
selected>

8 FPS

</option>


<option value="6">

6 FPS

</option>


</select>


</label>




<label>

每帧停留时间


<select id="timeSelect">


<option value="1">

1秒

</option>


<option value="2">

2秒

</option>


<option value="5">

5秒

</option>


<option value="10">

10秒

</option>


<option value="15">

15秒

</option>


<option value="30"
selected>

30秒

</option>


<option value="60">

60秒

</option>



</select>


</label>




<label>

跳帧倍率


<select id="skipSelect">


<option value="1">

1x

</option>


<option value="2">

2x

</option>


<option value="4">

4x

</option>


<option value="8">

8x

</option>



</select>


</label>




<label>

洋葱皮透明度

<input
id="onionOpacity"
type="range"
min="0"
max="100"
value="25"
>

</label>




<button onclick="startTraining()">

开始训练

</button>



</div>




<video id="video" playsinline></video>



</div>
<script>


// ============================
// Gesture Frame v1.2 Core
// ============================


const video =
document.getElementById("video");


const canvas =
document.getElementById("canvas");


const ctx =
canvas.getContext("2d");



let frames=[];


// 图片缓存
let frameImages=[];


let currentFrame=0;


let fps=8;



// 洋葱

let onion=false;



// 播放/训练状态

let playing=false;

let training=false;

let playTimer=null;

let trainingTimer=null;

let countdownInterval=null;

let remainingTime=0;


// ============================
// 设置
// ============================


function toggleSettings(){

document
.getElementById("settings")
.classList
.toggle("hidden");

}



// ============================
// 上传视频
// ============================


document
.getElementById("fileInput")
.onchange=function(e){


if(e.target.files[0]){


loadVideo(
 e.target.files[0]
);


}


};




function loadVideo(file){


video.src =
URL.createObjectURL(file);



video.onloadedmetadata=function(){



if(video.duration>10){


alert(
"视频超过10秒，请选择短视频"
);


return;


}



extractFrames();



};


}





// ============================
// 抽帧
// ============================


async function extractFrames(){



fps =
Number(
document
.getElementById("fpsSelect")
.value
);



let total =
Math.ceil(
video.duration * fps
);



frames=[];

frameImages=[];



showProgress(true);




let temp =
document.createElement("canvas");


temp.width =
video.videoWidth;


temp.height =
video.videoHeight;



let tctx =
temp.getContext("2d");




for(
let i=0;
i<total;
i++
){



await seekVideo(
 i/fps
);



tctx.drawImage(
video,
0,
0
);



let data =
temp.toDataURL(
"image/jpeg",
0.9
);




frames.push(data);




// 关键：等待图片加载

let img =
new Image();



await new Promise(resolve=>{


img.onload=function(){

resolve();

};



img.src=data;



});




frameImages.push(img);




updateProgress(
 i+1,
 total
);



}




showProgress(false);

currentFrame=0;

renderFrame();

updateTimeline();

updateInfo();

document.getElementById("empty").classList.add("hidden");


}


// ============================
// 视频seek
// ============================


function seekVideo(time){

return new Promise(resolve=>{

video.currentTime=time;

video.onseeked=function(){

resolve();

video.onseeked=null;

};

});

}


// ============================
// 渲染
// ============================

function renderFrame(){

if(frameImages.length===0) return;

ctx.clearRect(0,0,canvas.width,canvas.height);

if(onion && currentFrame>0){

ctx.globalAlpha=Number(document.getElementById("onionOpacity").value)/100*0.5;

ctx.drawImage(frameImages[currentFrame-1],0,0);

}

ctx.globalAlpha=1;

ctx.drawImage(frameImages[currentFrame],0,0);

}

// ============================
// 更新信息
// ============================

function updateInfo(){

let info=`Frame ${currentFrame+1} / ${frameImages.length}`;

document.getElementById("info").textContent=info;

}

function updateTimeline(){

let timeline=document.getElementById("timeline");

timeline.max=frameImages.length-1;

timeline.value=currentFrame;

let label=document.getElementById("frameLabel");

label.textContent=`Frame ${currentFrame+1} / ${frameImages.length}`;

}

// ============================
// 帧导航
// ============================

function prevFrame(){

if(frameImages.length===0) return;

stopCountdown();

currentFrame=Math.max(0,currentFrame-1);

renderFrame();

updateTimeline();

}

function nextFrame(){

if(frameImages.length===0) return;

stopCountdown();

currentFrame=Math.min(frameImages.length-1,currentFrame+1);

renderFrame();

updateTimeline();

}

// ============================
// 播放模式
// ============================

function togglePlay(){

if(frameImages.length===0) return;

playing=!playing;

if(playing){

let skip=Number(document.getElementById("skipSelect").value);

playTimer=setInterval(()=>{

currentFrame+=skip;

if(currentFrame>=frameImages.length){

currentFrame=frameImages.length-1;

playing=false;

clearInterval(playTimer);

return;

}

renderFrame();

updateTimeline();

},100);

}else{

clearInterval(playTimer);

}

}

// ============================
// 训练模式 - 带倒计时
// ============================

function toggleTraining(){

if(frameImages.length===0) return;

if(training){

stopTraining();

}else{

startTraining();

}

}

function startTraining(){

training=true;

currentFrame=0;

renderFrame();

updateTimeline();

startCountdown();

}

function stopTraining(){

training=false;

stopCountdown();

document.getElementById("countdown").classList.add("hidden");

}

// ============================
// 倒计时功能
// ============================

function startCountdown(){

let frameTime=Number(document.getElementById("timeSelect").value);

remainingTime=frameTime;

updateCountdownDisplay();

countdownInterval=setInterval(()=>{

remainingTime--;

updateCountdownDisplay();

if(remainingTime<=0){

autoNextFrame();

}

},1000);

}

function stopCountdown(){

if(countdownInterval){

clearInterval(countdownInterval);

countdownInterval=null;

}

}

function updateCountdownDisplay(){

let countdownEl=document.getElementById("countdown");

if(training){

countdownEl.textContent=`${remainingTime}秒`;

countdownEl.classList.remove("hidden");

}

}

function autoNextFrame(){

let frameTime=Number(document.getElementById("timeSelect").value);

currentFrame++;

if(currentFrame>=frameImages.length){

currentFrame=frameImages.length-1;

stopTraining();

return;

}

renderFrame();

updateTimeline();

remainingTime=frameTime;

updateCountdownDisplay();

}

// ============================
// 洋葱皮
// ============================

function toggleOnion(){

onion=!onion;

let btn=document.getElementById("onionBtn");

if(onion){

btn.style.background="#4CAF50";

}else{

btn.style.background="";

}

renderFrame();

}

// ============================
// 进度
// ============================

function showProgress(show){

document.getElementById("progressBox").style.display=show?"block":"none";

}

function updateProgress(current,total){

let percent=Math.round(current/total*100);

document.getElementById("progressBar").value=percent;

document.getElementById("progressText").textContent=`分析中... ${percent}%`;

}

// ============================
// 全屏
// ============================

function toggleFullscreen(){

if(!document.fullscreenElement){

document.documentElement.requestFullscreen().catch(err=>{

alert(`无法全屏: ${err.message}`);

});

}else{

document.exitFullscreen();

}

}

// ============================
// 时间轴互动
// ============================

document.getElementById("timeline").oninput=function(e){

stopCountdown();

stopTraining();

currentFrame=Number(e.target.value);

renderFrame();

updateTimeline();

};


</script>

</body>

</html>
